<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DJ Ilú - Assistente e Player de Mixagem</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(135deg, #0f0728 0%, #170b3b 50%, #0d041e 100%);
      color: #f3f4f6;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(168, 85, 247, 0.4);
      border-radius: 4px;
    }
  </style>
</head>
<body class="custom-scrollbar">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- BANCO LOCAL INDEXEDDB ---
    const DB_NAME = 'DJIluDB';
    const STORE_NAME = 'tracks';

    const initDB = () => {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: 'id' });
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    };

    const saveTrackToDB = async (track) => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        store.put(track);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    };

    const getAllTracksFromDB = async () => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    };

    const deleteTrackFromDB = async (id) => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        store.delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    };

    function App() {
      const [tracks, setTracks] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [crossfadeTime, setCrossfadeTime] = useState(6);
      const [djAlanEffect, setDjAlanEffect] = useState(false);
      const [playlists, setPlaylists] = useState(() => {
        const saved = localStorage.getItem('dj_ilu_playlists');
        return saved ? JSON.parse(saved) : [];
      });
      const [showPlaylistModal, setShowPlaylistModal] = useState(false);
      const [showSaveModal, setShowSaveModal] = useState(false);
      const [newPlaylistName, setNewPlaylistName] = useState('');

      const audioRef1 = useRef(new Audio());
      const audioRef2 = useRef(new Audio());
      const activeAudioRef = useRef(1);

      // Carregar faixas salvas ao iniciar
      useEffect(() => {
        getAllTracksFromDB().then((savedTracks) => {
          if (savedTracks && savedTracks.length > 0) {
            setTracks(savedTracks);
          }
        });

        // Atalho Ctrl + J
        const handleKeyDown = (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'j') {
            e.preventDefault();
            setShowPlaylistModal((prev) => !prev);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      // Persistir Playlists no LocalStorage
      useEffect(() => {
        localStorage.setItem('dj_ilu_playlists', JSON.stringify(playlists));
      }, [playlists]);

      // Upload de Arquivos MP3
      const handleFileUpload = async (e) => {
        const files = Array.from(e.target.files);
        for (let file of files) {
          const trackData = {
            id: 'track_' + Date.now() + '_' + Math.random().toString(36).substring(2, 5),
            name: file.name.replace(/\.[^/.]+$/, ''),
            file: file,
          };
          await saveTrackToDB(trackData);
          setTracks((prev) => [...prev, trackData]);
        }
      };

      // Reordenação por setas
      const moveTrackUp = (index) => {
        if (index <= 0) return;
        setTracks((prev) => {
          const newArr = [...prev];
          const temp = newArr[index - 1];
          newArr[index - 1] = newArr[index];
          newArr[index] = temp;
          return newArr;
        });
        if (currentIndex === index) setCurrentIndex(index - 1);
        else if (currentIndex === index - 1) setCurrentIndex(index);
      };

      const moveTrackDown = (index) => {
        if (index >= tracks.length - 1) return;
        setTracks((prev) => {
          const newArr = [...prev];
          const temp = newArr[index + 1];
          newArr[index + 1] = newArr[index];
          newArr[index] = temp;
          return newArr;
        });
        if (currentIndex === index) setCurrentIndex(index + 1);
        else if (currentIndex === index + 1) setCurrentIndex(index);
      };

      const removeTrack = async (id, index) => {
        await deleteTrackFromDB(id);
        setTracks((prev) => prev.filter((t) => t.id !== id));
        if (index === currentIndex && isPlaying) {
          setIsPlaying(false);
        }
      };

      // Tocar / Pausar
      const togglePlay = () => {
        if (tracks.length === 0) return;
        const currentAudio = activeAudioRef.current === 1 ? audioRef1.current : audioRef2.current;

        if (isPlaying) {
          currentAudio.pause();
          setIsPlaying(false);
        } else {
          if (!currentAudio.src && tracks[currentIndex]) {
            currentAudio.src = URL.createObjectURL(tracks[currentIndex].file);
          }
          currentAudio.play();
          setIsPlaying(true);
        }
      };

      // Forçar Crossfade
      const forceCrossfade = () => {
        if (tracks.length <= 1) return;
        setShowSaveModal(true);

        const nextIdx = (currentIndex + 1) % tracks.length;
        const currentAudio = activeAudioRef.current === 1 ? audioRef1.current : audioRef2.current;
        const nextAudio = activeAudioRef.current === 1 ? audioRef2.current : audioRef1.current;

        nextAudio.src = URL.createObjectURL(tracks[nextIdx].file);
        nextAudio.volume = 1;
        nextAudio.play();

        let step = 0;
        const totalSteps = 20;
        const intervalTime = (crossfadeTime * 1000) / totalSteps;

        const timer = setInterval(() => {
          step++;
          currentAudio.volume = Math.max(0, 1 - step / totalSteps);
          if (step >= totalSteps) {
            clearInterval(timer);
            currentAudio.pause();
            activeAudioRef.current = activeAudioRef.current === 1 ? 2 : 1;
            setCurrentIndex(nextIdx);
          }
        }, intervalTime);
      };

      // Salvar Playlist
      const handleSavePlaylist = () => {
        if (!newPlaylistName.trim()) return;
        const newEntry = {
          id: Date.now(),
          name: newPlaylistName,
          tracksCount: tracks.length,
          crossfadeTime,
          djAlanEffect,
          trackIds: tracks.map((t) => t.id),
        };
        setPlaylists((prev) => [...prev, newEntry]);
        setNewPlaylistName('');
        setShowSaveModal(false);
      };

      return (
        <div className="min-h-screen p-4 md:p-8 max-w-6xl mx-auto flex flex-col gap-6">
          {/* CABEÇALHO */}
          <header className="flex justify-between items-center glass-card p-5 rounded-2xl border border-purple-500/20">
            <div className="flex items-center gap-3">
              <div className="w-12 h-12 bg-purple-600 rounded-xl flex items-center justify-center text-2xl shadow-lg shadow-purple-600/40">
                🎧
              </div>
              <div>
                <h1 className="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-indigo-300">
                  DJ Ilú
                </h1>
                <p className="text-xs text-purple-300/60">Mixagem Inteligente e Controle de Transições</p>
              </div>
            </div>

            <button
              onClick={() => setShowPlaylistModal(true)}
              className="px-4 py-2 bg-purple-900/40 hover:bg-purple-800/60 border border-purple-500/30 rounded-xl text-sm font-medium flex items-center gap-2 transition"
            >
              <i className="fa-solid fa-folder-open"></i> Playlists <span className="text-xs opacity-50">(Ctrl+J)</span>
            </button>
          </header>

          {/* PAINEL PRINCIPAL */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="lg:col-span-2 flex flex-col gap-6">
              {/* UPLOAD DROPZONE */}
              <div className="glass-card p-8 rounded-2xl border-dashed border-2 border-purple-500/30 hover:border-purple-500/60 transition text-center flex flex-col items-center justify-center relative">
                <input
                  type="file"
                  multiple
                  accept="audio/*"
                  onChange={handleFileUpload}
                  className="absolute inset-0 opacity-0 cursor-pointer w-full h-full"
                />
                <i className="fa-solid fa-cloud-arrow-up text-4xl text-purple-400 mb-3"></i>
                <p className="font-semibold text-lg">Arraste seus arquivos MP3 aqui</p>
                <p className="text-xs text-purple-300/50 mt-1">Ou clique para selecionar múltiplos arquivos</p>
              </div>

              {/* PLAYER CONTROLS */}
              <div className="glass-card p-6 rounded-2xl flex flex-col gap-4">
                <div className="flex justify-between items-center">
                  <div>
                    <span className="text-xs text-purple-400 uppercase tracking-wider font-semibold">Tocando Agora</span>
                    <h2 className="text-lg font-bold text-white mt-1">
                      {tracks[currentIndex] ? tracks[currentIndex].name : 'Nenhuma música selecionada'}
                    </h2>
                  </div>
                  <button
                    onClick={togglePlay}
                    className="w-14 h-14 bg-purple-600 hover:bg-purple-500 rounded-full flex items-center justify-center text-xl shadow-lg shadow-purple-600/50 transition"
                  >
                    <i className={`fa-solid ${isPlaying ? 'fa-pause' : 'fa-play'}`}></i>
                  </button>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-2 pt-4 border-t border-white/5">
                  <div>
                    <label className="text-xs text-purple-300/70 block mb-1">
                      Tempo de Crossfade: <span className="font-bold text-purple-300">{crossfadeTime}s</span>
                    </label>
                    <input
                      type="range"
                      min="1"
                      max="15"
                      value={crossfadeTime}
                      onChange={(e) => setCrossfadeTime(Number(e.target.value))}
                      className="w-full accent-purple-500 cursor-pointer"
                    />
                  </div>

                  <div className="flex items-center justify-between">
                    <div>
                      <span className="text-xs font-semibold text-purple-300 block">Efeito DJ Alan</span>
                      <span className="text-[10px] text-purple-300/50 block">Corta vozes / Eleva graves</span>
                    </div>
                    <button
                      onClick={() => setDjAlanEffect(!djAlanEffect)}
                      className={`w-12 h-6 rounded-full p-1 transition ${
                        djAlanEffect ? 'bg-purple-600' : 'bg-gray-700'
                      }`}
                    >
                      <div
                        className={`w-4 h-4 rounded-full bg-white transition transform ${
                          djAlanEffect ? 'translate-x-6' : 'translate-x-0'
                        }`}
                      ></div>
                    </button>
                  </div>
                </div>

                <button
                  onClick={forceCrossfade}
                  className="w-full py-3 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 rounded-xl font-bold shadow-lg shadow-purple-900/40 flex items-center justify-center gap-2 transition mt-2"
                >
                  <i className="fa-solid fa-bolt"></i> Forçar Crossfade Agora
                </button>
              </div>
            </div>

            {/* FILA DE MÚSICAS COM REORDENAÇÃO */}
            <div className="glass-card p-6 rounded-2xl flex flex-col h-[520px]">
              <div className="flex justify-between items-center mb-4">
                <h3 className="font-bold text-purple-300 flex items-center gap-2">
                  <i className="fa-solid fa-list-ul"></i> Fila Atual ({tracks.length})
                </h3>
                {tracks.length > 0 && (
                  <button
                    onClick={() => setTracks([])}
                    className="text-xs text-red-400 hover:text-red-300 transition"
                  >
                    Limpar
                  </button>
                )}
              </div>

              <div className="flex-1 overflow-y-auto custom-scrollbar flex flex-col gap-2 pr-1">
                {tracks.length === 0 ? (
                  <div className="text-center text-purple-300/40 text-sm my-auto">
                    Nenhuma música na fila.<br />Envie seus MP3 acima.
                  </div>
                ) : (
                  tracks.map((track, idx) => (
                    <div
                      key={track.id}
                      className={`p-3 rounded-xl flex items-center justify-between gap-2 border transition ${
                        idx === currentIndex
                          ? 'bg-purple-600/20 border-purple-500/50 text-purple-200'
                          : 'bg-white/5 border-white/5 hover:bg-white/10'
                      }`}
                    >
                      <div className="flex items-center gap-2 min-w-0">
                        {/* SETAS PARA REORDENAR */}
                        <div className="flex flex-col gap-1 text-purple-300/60">
                          <button
                            onClick={() => moveTrackUp(idx)}
                            disabled={idx === 0}
                            className="hover:text-purple-300 disabled:opacity-20 transition text-[10px]"
                            title="Mover para cima"
                          >
                            <i className="fa-solid fa-chevron-up"></i>
                          </button>
                          <button
                            onClick={() => moveTrackDown(idx)}
                            disabled={idx === tracks.length - 1}
                            className="hover:text-purple-300 disabled:opacity-20 transition text-[10px]"
                            title="Mover para baixo"
                          >
                            <i className="fa-solid fa-chevron-down"></i>
                          </button>
                        </div>

                        <span className="text-xs font-mono opacity-50 w-4">{idx + 1}</span>
                        <span className="text-sm truncate font-medium">{track.name}</span>
                      </div>

                      <div className="flex items-center gap-2">
                        <button
                          onClick={() => {
                            setCurrentIndex(idx);
                            setIsPlaying(true);
                          }}
                          className="text-purple-400 hover:text-purple-200 p-1"
                        >
                          <i className="fa-solid fa-play text-xs"></i>
                        </button>
                        <button
                          onClick={() => removeTrack(track.id, idx)}
                          className="text-gray-500 hover:text-red-400 p-1"
                        >
                          <i className="fa-solid fa-xmark text-xs"></i>
                        </button>
                      </div>
                    </div>
                  ))
                )}
              </div>
            </div>
          </div>

          {/* MODAL SALVAR PLAYLIST */}
          {showSaveModal && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="glass-card p-6 rounded-2xl max-w-md w-full border border-purple-500/30 flex flex-col gap-4">
                <h3 className="text-lg font-bold">Salvar Transição / Playlist</h3>
                <p className="text-xs text-purple-300/70">
                  Deseja guardar essa sequência atual e o tempo de crossfade ({crossfadeTime}s) como uma playlist salva?
                </p>
                <input
                  type="text"
                  placeholder="Nome da Playlist (ex: Entrada do Casamento)"
                  value={newPlaylistName}
                  onChange={(e) => setNewPlaylistName(e.target.value)}
                  className="w-full bg-black/40 border border-purple-500/30 rounded-xl p-3 text-sm focus:outline-none focus:border-purple-500"
                />
                <div className="flex justify-end gap-3 mt-2">
                  <button
                    onClick={() => setShowSaveModal(false)}
                    className="px-4 py-2 text-sm text-purple-300/60 hover:text-purple-300"
                  >
                    Agora não
                  </button>
                  <button
                    onClick={handleSavePlaylist}
                    className="px-4 py-2 bg-purple-600 hover:bg-purple-500 rounded-xl text-sm font-semibold shadow-lg shadow-purple-600/30"
                  >
                    Salvar Playlist
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL PLAYLISTS SALVAS (CTRL + J) */}
          {showPlaylistModal && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="glass-card p-6 rounded-2xl max-w-lg w-full border border-purple-500/30 flex flex-col gap-4 max-h-[80vh]">
                <div className="flex justify-between items-center">
                  <h3 className="text-lg font-bold flex items-center gap-2">
                    <i className="fa-solid fa-folder"></i> Minhas Playlists
                  </h3>
                  <button
                    onClick={() => setShowPlaylistModal(false)}
                    className="text-gray-400 hover:text-white"
                  >
                    <i className="fa-solid fa-xmark"></i>
                  </button>
                </div>

                <div className="overflow-y-auto custom-scrollbar flex flex-col gap-3 pr-1 my-2">
                  {playlists.length === 0 ? (
                    <p className="text-center text-sm text-purple-300/40 py-8">
                      Nenhuma playlist salva ainda. Use "Forçar Crossfade" para salvar suas sequências.
                    </p>
                  ) : (
                    playlists.map((pl) => (
                      <div
                        key={pl.id}
                        className="p-4 rounded-xl bg-white/5 border border-white/5 flex justify-between items-center"
                      >
                        <div>
                          <h4 className="font-bold text-purple-200">{pl.name}</h4>
                          <span className="text-xs text-purple-300/50">
                            {pl.tracksCount} músicas • Crossfade: {pl.crossfadeTime}s
                          </span>
                        </div>
                        <button
                          onClick={() => {
                            setCrossfadeTime(pl.crossfadeTime);
                            setDjAlanEffect(pl.djAlanEffect);
                            setShowPlaylistModal(false);
                          }}
                          className="px-3 py-1.5 bg-purple-600 hover:bg-purple-500 rounded-lg text-xs font-semibold"
                        >
                          Carregar
                        </button>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
