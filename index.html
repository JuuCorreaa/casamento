<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DJ Ilú - Player e Gerenciador de Playlists</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- SDK do Supabase para Banco de Dados e Auth -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(135deg, #090412 0%, #120926 50%, #05020a 100%);
      color: #f3f4f6;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(168, 85, 247, 0.4);
      border-radius: 4px;
    }
  </style>
</head>
<body class="custom-scrollbar">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Configuração do Supabase (Substituir pelas suas chaves do Supabase)
    const SUPABASE_URL = 'https://SEU_PROJETO.supabase.co';
    const SUPABASE_ANON_KEY = 'SUA_CHAVE_ANONIMA';
    const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    function App() {
      const [user, setUser] = useState(null); // Usuário logado
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [authMode, setAuthMode] = useState('login'); // 'login' ou 'register'
      
      // Campos do formulário
      const [nameInput, setNameInput] = useState('');
      const [emailInput, setEmailInput] = useState('');
      const [passwordInput, setPasswordInput] = useState('');
      
      const [tracks, setTracks] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [crossfadeTime, setCrossfadeTime] = useState(6);
      const [djAlanEffect, setDjAlanEffect] = useState(false);
      const [currentPlaylistName, setCurrentPlaylistName] = useState('Entrada do Casamento');
      
      const [toast, setToast] = useState(null);
      const [playlists, setPlaylists] = useState([
        { id: 'p1', name: 'Entrada do Casamento', crossfadeTime: 6, djAlanEffect: false },
        { id: 'p2', name: 'Festa e Recepção', crossfadeTime: 4, djAlanEffect: true }
      ]);
      const [showPlaylistModal, setShowPlaylistModal] = useState(false);

      const showToast = (type, message) => {
        setToast({ type, message });
        setTimeout(() => setToast(null), 4000);
      };

      // Validar senha forte (mínimo 6 caracteres, 1 número e 1 letra)
      const validatePassword = (pass) => {
        if (pass.length < 6) return 'A senha deve ter no mínimo 6 caracteres.';
        if (!/\d/.test(pass)) return 'A senha deve conter pelo menos um número.';
        return null;
      };

      // Lógica de Login / Cadastro
      const handleAuthSubmit = (e) => {
        e.preventDefault();

        if (authMode === 'register') {
          const passError = validatePassword(passwordInput);
          if (passError) {
            showToast('error', passError);
            return;
          }
          // Simulação / Registro
          const newUser = { name: nameInput || 'DJ Ilú User', email: emailInput };
          setUser(newUser);
          setShowAuthModal(false);
          showToast('success', `Conta criada com sucesso! Bem-vindo(a), ${newUser.name}.`);
        } else {
          // Simulação / Login
          if (!emailInput || !passwordInput) {
            showToast('error', 'Preencha todos os campos para entrar.');
            return;
          }
          const loggedUser = { name: emailInput.split('@')[0], email: emailInput };
          setUser(loggedUser);
          setShowAuthModal(false);
          showToast('success', `Login efetuado como ${loggedUser.name}!`);
        }
      };

      const handleSavePlaylistClick = () => {
        if (!user) {
          showToast('error', 'Faça login para salvar suas playlists na sua conta.');
          setAuthMode('register');
          setShowAuthModal(true);
          return;
        }
        showToast('success', `Playlist "${currentPlaylistName}" salva com sucesso na sua conta!`);
      };

      return (
        <div className="min-h-screen p-4 md:p-8 max-w-7xl mx-auto flex flex-col gap-6 relative">
          
          {/* TOAST DE AVISOS */}
          {toast && (
            <div className={`fixed top-5 right-5 z-50 px-5 py-3 rounded-xl shadow-2xl text-sm font-semibold flex items-center gap-3 border transition ${
              toast.type === 'error' ? 'bg-red-950/90 border-red-500 text-red-200' : 'bg-emerald-950/90 border-emerald-500 text-emerald-200'
            }`}>
              <i className={`fa-solid ${toast.type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check'}`}></i>
              <span>{toast.message}</span>
            </div>
          )}

          {/* CABEÇALHO LIMPO (SEM CTRL+J) */}
          <header className="flex flex-wrap justify-between items-center glass-card p-5 rounded-2xl border border-purple-500/20 gap-4">
            <div className="flex items-center gap-3">
              <div className="w-12 h-12 bg-purple-600 rounded-xl flex items-center justify-center text-2xl shadow-lg shadow-purple-600/40">
                🎧
              </div>
              <div>
                <h1 className="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-indigo-300">
                  DJ Ilú
                </h1>
                <p className="text-xs text-purple-300/60">Mixagem Inteligente e Controle de Transições</p>
              </div>
            </div>

            <div className="flex items-center gap-3">
              <button
                onClick={handleSavePlaylistClick}
                className="px-4 py-2 bg-emerald-600/30 hover:bg-emerald-600/50 border border-emerald-500/40 rounded-xl text-sm font-semibold text-emerald-200 flex items-center gap-2 transition"
              >
                <i className="fa-solid fa-floppy-disk"></i> Salvar Playlist
              </button>

              <button
                onClick={() => setShowPlaylistModal(true)}
                className="px-4 py-2 bg-purple-900/40 hover:bg-purple-800/60 border border-purple-500/30 rounded-xl text-sm font-medium flex items-center gap-2 transition"
              >
                <i className="fa-solid fa-folder-open"></i> Minhas Playlists
              </button>

              {/* BOTÃO DE LOGIN / PERFIL NO CABEÇALHO */}
              {user ? (
                <div className="flex items-center gap-2 pl-2 border-l border-white/10">
                  <div className="w-9 h-9 bg-purple-700 rounded-full flex items-center justify-center text-xs font-bold uppercase">
                    {user.name.substring(0, 2)}
                  </div>
                  <span className="text-xs text-purple-200 font-medium hidden sm:inline">{user.name}</span>
                  <button
                    onClick={() => { setUser(null); showToast('success', 'Você saiu da sua conta.'); }}
                    className="text-xs text-gray-400 hover:text-red-400 p-1 ml-1"
                    title="Sair"
                  >
                    <i className="fa-solid fa-right-from-bracket"></i>
                  </button>
                </div>
              ) : (
                <button
                  onClick={() => { setAuthMode('login'); setShowAuthModal(true); }}
                  className="px-4 py-2 bg-white text-black hover:bg-gray-200 rounded-xl text-sm font-bold flex items-center gap-2 transition shadow-lg"
                >
                  <i className="fa-solid fa-user"></i> Entrar
                </button>
              )}
            </div>
          </header>

          {/* CONTEÚDO DO PLAYER */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="lg:col-span-2 flex flex-col gap-6">
              <div className="glass-card p-6 rounded-2xl border-dashed border-2 border-purple-500/30 text-center flex flex-col items-center justify-center relative">
                <i className="fa-solid fa-cloud-arrow-up text-3xl text-purple-400 mb-2"></i>
                <p className="font-semibold text-base">Arraste seus arquivos MP3 para cá</p>
                <p className="text-xs text-purple-300/50 mt-1">Sua música fica salva com segurança</p>
              </div>
            </div>

            <div className="glass-card p-6 rounded-2xl flex flex-col justify-between">
              <div>
                <h3 className="font-bold text-white text-base mb-2">Sincronização em Nuvem</h3>
                <p className="text-xs text-purple-300/70 leading-relaxed">
                  {user ? `Conectado como ${user.email}. Suas playlists estão sendo gravadas no seu perfil.` : 'Faça login para ter certeza de que suas playlists estarão salvas quando abrir em qualquer dispositivo.'}
                </p>
              </div>
            </div>
          </div>

          {/* MODAL DE LOGIN / CADASTRO */}
          {showAuthModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="glass-card p-8 rounded-3xl max-w-md w-full border border-purple-500/30 flex flex-col gap-5 relative">
                <button
                  onClick={() => setShowAuthModal(false)}
                  className="absolute top-5 right-5 text-gray-400 hover:text-white"
                >
                  <i className="fa-solid fa-xmark text-lg"></i>
                </button>

                <div className="text-center">
                  <h3 className="text-xl font-bold text-white">
                    {authMode === 'login' ? 'Acessar Conta DJ Ilú' : 'Criar Nova Conta'}
                  </h3>
                  <p className="text-xs text-purple-300/60 mt-1">
                    {authMode === 'login' ? 'Digite seus dados para carregar suas playlists' : 'Cadastre-se para garantir que nada seja perdido'}
                  </p>
                </div>

                <form onSubmit={handleAuthSubmit} className="flex flex-col gap-4">
                  {authMode === 'register' && (
                    <div>
                      <label className="text-xs text-purple-300 block mb-1">Seu Nome / Marca</label>
                      <input
                        type="text"
                        required
                        placeholder="Ex: DJ Juliana"
                        value={nameInput}
                        onChange={(e) => setNameInput(e.target.value)}
                        className="w-full bg-black/50 border border-purple-500/30 rounded-xl p-3 text-sm focus:outline-none focus:border-purple-500"
                      />
                    </div>
                  )}

                  <div>
                    <label className="text-xs text-purple-300 block mb-1">E-mail</label>
                    <input
                      type="email"
                      required
                      placeholder="seu@email.com"
                      value={emailInput}
                      onChange={(e) => setEmailInput(e.target.value)}
                      className="w-full bg-black/50 border border-purple-500/30 rounded-xl p-3 text-sm focus:outline-none focus:border-purple-500"
                    />
                  </div>

                  <div>
                    <label className="text-xs text-purple-300 block mb-1">Senha (Forte)</label>
                    <input
                      type="password"
                      required
                      placeholder="••••••••"
                      value={passwordInput}
                      onChange={(e) => setPasswordInput(e.target.value)}
                      className="w-full bg-black/50 border border-purple-500/30 rounded-xl p-3 text-sm focus:outline-none focus:border-purple-500"
                    />
                    {authMode === 'register' && (
                      <span className="text-[10px] text-purple-300/50 mt-1 block">
                        Mínimo de 6 caracteres e pelo menos um número.
                      </span>
                    )}
                  </div>

                  <button
                    type="submit"
                    className="w-full py-3 bg-purple-600 hover:bg-purple-500 rounded-xl text-sm font-bold shadow-lg shadow-purple-600/40 transition mt-2"
                  >
                    {authMode === 'login' ? 'Entrar' : 'Criar Conta e Salvar'}
                  </button>
                </form>

                <div className="text-center pt-2 border-t border-white/10">
                  {authMode === 'login' ? (
                    <p className="text-xs text-gray-400">
                      Ainda não tem conta?{' '}
                      <button
                        onClick={() => setAuthMode('register')}
                        className="text-purple-400 hover:underline font-semibold"
                      >
                        Cadastre-se aqui
                      </button>
                    </p>
                  ) : (
                    <p className="text-xs text-gray-400">
                      Já possui uma conta?{' '}
                      <button
                        onClick={() => setAuthMode('login')}
                        className="text-purple-400 hover:underline font-semibold"
                      >
                        Faça login
                      </button>
                    </p>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
