<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DJ Ilú - Assistente e Player de Mixagem</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(135deg, #0f0728 0%, #170b3b 50%, #0d041e 100%);
      color: #f3f4f6;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(168, 85, 247, 0.4);
      border-radius: 4px;
    }
  </style>
</head>
<body class="custom-scrollbar">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- BANCO LOCAL INDEXEDDB PARA ARMAZENAR MP3 ---
    const DB_NAME = 'DJIluDB';
    const STORE_NAME = 'tracks';

    const initDB = () => {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: 'id' });
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    };

    const saveTrackToDB = async (track) => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        store.put(track);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    };

    const getAllTracksFromDB = async () => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    };

    const deleteTrackFromDB = async (id) => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        store.delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    };

    function App() {
      const [shareModeData, setShareModeData] = useState(null);
      const [tracks, setTracks] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [currentTime, setCurrentTime] = useState(0);
      const [duration, setDuration] = useState(0);
      const [crossfadeTime, setCrossfadeTime] = useState(6);
      const [djAlanEffect, setDjAlanEffect] = useState(false);
      const [currentPlaylistName, setCurrentPlaylistName] = useState('Entrada do Casamento');
      const [toast, setToast] = useState(null);

      // Playlists salvas no LocalStorage
      const [playlists, setPlaylists] = useState(() => {
        const saved = localStorage.getItem('dj_ilu_playlists_v3');
        return saved ? JSON.parse(saved) : [
          { id: 'p1', name: 'Entrada do Casamento', crossfadeTime: 6, djAlanEffect: false },
          { id: 'p2', name: 'Festa e Recepção', crossfadeTime: 4, djAlanEffect: true }
        ];
      });

      const [showPlaylistModal, setShowPlaylistModal] = useState(false);
      const [newPlaylistInput, setNewPlaylistInput] = useState('');

      // Chat Gemini AI DJ
      const [aiMessages, setAiMessages] = useState([
        { sender: 'ai', text: 'Olá! Sou o assistente DJ Ilú. Como posso ajudar com os momentos ou a ordem das músicas do seu evento?' }
      ]);
      const [userInput, setUserInput] = useState('');

      const audioRef1 = useRef(new Audio());
      const audioRef2 = useRef(new Audio());
      const activeAudioRef = useRef(1);

      const showToastMessage = (type, message) => {
        setToast({ type, message });
        setTimeout(() => setToast(null), 4000);
      };

      // Guardar playlists
      useEffect(() => {
        localStorage.setItem('dj_ilu_playlists_v3', JSON.stringify(playlists));
      }, [playlists]);

      // Verificar URL partilhada e carregar faixas
      useEffect(() => {
        const hash = window.location.hash;
        if (hash.startsWith('#share')) {
          const params = new URLSearchParams(hash.replace('#share?', ''));
          const name = params.get('name') || 'Playlist DJ Ilú';
          const trackListRaw = params.get('tracks');
          const trackNames = trackListRaw ? trackListRaw.split('|') : [];
          const crossfade = Number(params.get('cf')) || 6;

          setShareModeData({ name, trackNames, crossfade });
        }

        getAllTracksFromDB().then((savedTracks) => {
          if (savedTracks && savedTracks.length > 0) {
            setTracks(savedTracks);
          }
        });
      }, []);

      // Atualizar tempo do áudio
      useEffect(() => {
        const audio = activeAudioRef.current === 1 ? audioRef1.current : audioRef2.current;

        const handleTimeUpdate = () => {
          setCurrentTime(audio.currentTime || 0);
          setDuration(audio.duration || 0);
        };

        const handleEnded = () => {
          forceCrossfade();
        };

        audio.addEventListener('timeupdate', handleTimeUpdate);
        audio.addEventListener('ended', handleEnded);

        return () => {
          audio.removeEventListener('timeupdate', handleTimeUpdate);
          audio.removeEventListener('ended', handleEnded);
        };
      }, [currentIndex, tracks]);

      // Upload MP3
      const handleFileUpload = async (e) => {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        try {
          for (let file of files) {
            const trackData = {
              id: 'track_' + Date.now() + '_' + Math.random().toString(36).substring(2, 5),
              name: file.name.replace(/\.[^/.]+$/, ''),
              file: file,
            };
            await saveTrackToDB(trackData);
            setTracks((prev) => [...prev, trackData]);
          }
          showToastMessage('success', `${files.length} música(s) adicionada(s) e salvas localmente!`);
        } catch (err) {
          showToastMessage('error', `Erro ao salvar MP3: ${err.message}`);
        }
      };

      // Mover músicas (Reordenar)
      const moveTrackUp = (index) => {
        if (index <= 0) return;
        setTracks((prev) => {
          const newArr = [...prev];
          const temp = newArr[index - 1];
          newArr[index - 1] = newArr[index];
          newArr[index] = temp;
          return newArr;
        });
        if (currentIndex === index) setCurrentIndex(index - 1);
        else if (currentIndex === index - 1) setCurrentIndex(index);
      };

      const moveTrackDown = (index) => {
        if (index >= tracks.length - 1) return;
        setTracks((prev) => {
          const newArr = [...prev];
          const temp = newArr[index + 1];
          newArr[index + 1] = newArr[index];
          newArr[index] = temp;
          return newArr;
        });
        if (currentIndex === index) setCurrentIndex(index + 1);
        else if (currentIndex === index + 1) setCurrentIndex(index);
      };

      const removeTrack = async (id, index) => {
        try {
          await deleteTrackFromDB(id);
          setTracks((prev) => prev.filter((t) => t.id !== id));
          if (index === currentIndex && isPlaying) {
            setIsPlaying(false);
          }
          showToastMessage('success', 'Música removida.');
        } catch (err) {
          showToastMessage('error', `Erro ao remover: ${err.message}`);
        }
      };

      // Play / Pause
      const togglePlay = () => {
        if (tracks.length === 0) {
          showToastMessage('error', 'Nenhuma música na fila. Adicione ficheiros MP3 acima.');
          return;
        }
        const currentAudio = activeAudioRef.current === 1 ? audioRef1.current : audioRef2.current;

        if (isPlaying) {
          currentAudio.pause();
          setIsPlaying(false);
        } else {
          try {
            if (!currentAudio.src && tracks[currentIndex]) {
              currentAudio.src = URL.createObjectURL(tracks[currentIndex].file);
            }
            currentAudio.play();
            setIsPlaying(true);
          } catch (err) {
            showToastMessage('error', `Erro ao reproduzir: ${err.message}`);
          }
        }
      };

      // Clicar na barra do tempo (Scrubbing)
      const handleSeek = (e) => {
        const audio = activeAudioRef.current === 1 ? audioRef1.current : audioRef2.current;
        if (!audio || !duration) return;
        const rect = e.currentTarget.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const newTime = (clickX / rect.width) * duration;
        audio.currentTime = newTime;
        setCurrentTime(newTime);
      };

      // Forçar Crossfade Direto
      const forceCrossfade = () => {
        if (tracks.length <= 1) {
          showToastMessage('error', 'Adicione pelo menos 2 músicas para realizar o Crossfade.');
          return;
        }

        const nextIdx = (currentIndex + 1) % tracks.length;
        const currentAudio = activeAudioRef.current === 1 ? audioRef1.current : audioRef2.current;
        const nextAudio = activeAudioRef.current === 1 ? audioRef2.current : audioRef1.current;

        try {
          nextAudio.src = URL.createObjectURL(tracks[nextIdx].file);
          nextAudio.volume = 1;
          nextAudio.play();

          let step = 0;
          const totalSteps = 20;
          const intervalTime = (crossfadeTime * 1000) / totalSteps;

          const timer = setInterval(() => {
            step++;
            currentAudio.volume = Math.max(0, 1 - step / totalSteps);
            if (step >= totalSteps) {
              clearInterval(timer);
              currentAudio.pause();
              activeAudioRef.current = activeAudioRef.current === 1 ? 2 : 1;
              setCurrentIndex(nextIdx);
            }
          }, intervalTime);
        } catch (err) {
          showToastMessage('error', `Erro no crossfade: ${err.message}`);
        }
      };

      // Salvar Playlist Manual
      const handleManualSave = () => {
        setPlaylists((prev) => {
          const exists = prev.find(p => p.name.toLowerCase() === currentPlaylistName.toLowerCase());
          if (exists) {
            return prev.map(p => p.id === exists.id ? { ...p, crossfadeTime, djAlanEffect } : p);
          } else {
            return [...prev, { id: 'pl_' + Date.now(), name: currentPlaylistName, crossfadeTime, djAlanEffect }];
          }
        });
        showToastMessage('success', `Playlist "${currentPlaylistName}" salva com sucesso!`);
      };

      // Criar Playlist no Modal
      const handleCreatePlaylist = () => {
        if (!newPlaylistInput.trim()) {
          showToastMessage('error', 'Digite um nome para a playlist.');
          return;
        }
        const newEntry = {
          id: 'pl_' + Date.now(),
          name: newPlaylistInput.trim(),
          crossfadeTime,
          djAlanEffect
        };
        setPlaylists((prev) => [...prev, newEntry]);
        setNewPlaylistInput('');
        showToastMessage('success', 'Nova playlist criada!');
      };

      // Compartilhar Link
      const handleSharePlaylist = () => {
        if (tracks.length === 0) {
          showToastMessage('error', 'Adicione músicas à fila antes de compartilhar.');
          return;
        }
        const trackNamesStr = encodeURIComponent(tracks.map(t => t.name).join('|'));
        const playlistNameStr = encodeURIComponent(currentPlaylistName);
        const shareUrl = `${window.location.origin}${window.location.pathname}#share?name=${playlistNameStr}&tracks=${trackNamesStr}&cf=${crossfadeTime}`;

        navigator.clipboard.writeText(shareUrl).then(() => {
          showToastMessage('success', 'Link estilo SoundCloud copiado!');
        }).catch(() => {
          showToastMessage('error', 'Erro ao copiar o link.');
        });
      };

      // IA Chat
      const handleSendMessage = () => {
        if (!userInput.trim()) return;
        const text = userInput;
        setAiMessages((prev) => [...prev, { sender: 'user', text }]);
        setUserInput('');

        setTimeout(() => {
          let reply = 'Essa ordem de faixas fica incrível! Recomendo colocar a transição em 6s para essa troca.';
          if (text.toLowerCase().includes('casamento') || text.toLowerCase().includes('noiva')) {
            reply = 'Para momentos de cerimônia ou entrada, uma transição suave de 8 segundos garante a emoção perfeita!';
          } else if (text.toLowerCase().includes('festa') || text.toLowerCase().includes('dança')) {
            reply = 'Para a pista de dança, experimente o Efeito DJ Alan nos últimos 5s para destacar a batida!';
          }
          setAiMessages((prev) => [...prev, { sender: 'ai', text: reply }]);
        }, 600);
      };

      const formatTime = (time) => {
        if (isNaN(time)) return '0:00';
        const mins = Math.floor(time / 60);
        const secs = Math.floor(time % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
      };

      // MODO MINIMALISTA COMPARTILHADO (ESTILO SOUNDCLOUD)
      if (shareModeData) {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center p-6 bg-gradient-to-b from-black via-zinc-900 to-black text-white">
            <div className="max-w-md w-full glass-card p-8 rounded-3xl border border-white/10 shadow-2xl flex flex-col items-center text-center gap-6">
              <div className="w-20 h-20 bg-gradient-to-tr from-purple-600 to-indigo-500 rounded-full flex items-center justify-center text-4xl shadow-xl shadow-purple-500/25 animate-pulse">
                🎧
              </div>
              <div>
                <span className="text-xs font-semibold uppercase tracking-widest text-purple-400">DJ Ilú • Playlist</span>
                <h1 className="text-2xl font-black text-white mt-1">{shareModeData.name}</h1>
                <p className="text-xs text-gray-400 mt-1">{shareModeData.trackNames.length} faixas selecionadas</p>
              </div>

              <button
                onClick={() => {
                  window.location.hash = '';
                  setShareModeData(null);
                }}
                className="w-full py-4 bg-white text-black hover:bg-gray-200 rounded-2xl font-extrabold text-base transition transform active:scale-95 flex items-center justify-center gap-3 shadow-lg"
              >
                <i className="fa-solid fa-play text-lg"></i> Abrir no DJ Ilú Studio
              </button>

              <div className="w-full text-left bg-black/40 p-4 rounded-2xl border border-white/5 max-h-56 overflow-y-auto custom-scrollbar flex flex-col gap-2">
                <span className="text-[10px] uppercase font-bold text-gray-500 tracking-wider">Músicas da Playlist</span>
                {shareModeData.trackNames.map((name, idx) => (
                  <div key={idx} className="text-xs text-gray-300 py-1.5 border-b border-white/5 flex items-center gap-2 truncate">
                    <span className="text-purple-400 font-mono text-[10px]">{idx + 1}.</span>
                    <span className="truncate">{name}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        );
      }

      // PLAYER COMPLETO
      return (
        <div className="min-h-screen p-4 md:p-8 max-w-7xl mx-auto flex flex-col gap-6 relative">
          
          {/* TOAST DE AVISOS */}
          {toast && (
            <div className={`fixed top-5 right-5 z-50 px-5 py-3 rounded-xl shadow-2xl text-sm font-semibold flex items-center gap-3 border transition ${
              toast.type === 'error' ? 'bg-red-950/90 border-red-500 text-red-200' : 'bg-emerald-950/90 border-emerald-500 text-emerald-200'
            }`}>
              <i className={`fa-solid ${toast.type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check'}`}></i>
              <span>{toast.message}</span>
            </div>
          )}

          {/* CABEÇALHO */}
          <header className="flex flex-wrap justify-between items-center glass-card p-5 rounded-2xl border border-purple-500/20 gap-4">
            <div className="flex items-center gap-3">
              <div className="w-12 h-12 bg-purple-600 rounded-xl flex items-center justify-center text-2xl shadow-lg shadow-purple-600/40">
                🎧
              </div>
              <div>
                <h1 className="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-indigo-300">
                  DJ Ilú
                </h1>
                <p className="text-xs text-purple-300/60">Mixagem Inteligente e Controle de Transições</p>
              </div>
            </div>

            <div className="flex items-center gap-3">
              <button
                onClick={handleManualSave}
                className="px-4 py-2 bg-emerald-600/30 hover:bg-emerald-600/50 border border-emerald-500/40 rounded-xl text-sm font-semibold text-emerald-200 flex items-center gap-2 transition"
              >
                <i className="fa-solid fa-floppy-disk"></i> Salvar Playlist
              </button>

              <button
                onClick={handleSharePlaylist}
                className="px-4 py-2 bg-indigo-600/40 hover:bg-indigo-600/60 border border-indigo-500/40 rounded-xl text-sm font-semibold text-indigo-200 flex items-center gap-2 transition"
              >
                <i className="fa-solid fa-share-nodes"></i> Compartilhar Link
              </button>

              <button
                onClick={() => setShowPlaylistModal(true)}
                className="px-4 py-2 bg-purple-900/40 hover:bg-purple-800/60 border border-purple-500/30 rounded-xl text-sm font-medium flex items-center gap-2 transition"
              >
                <i className="fa-solid fa-folder-open"></i> Playlists
              </button>
            </div>
          </header>

          {/* PAINEL PRINCIPAL DE 3 COLUNAS */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <div className="lg:col-span-2 flex flex-col gap-6">
              
              {/* DROPZONE */}
              <div className="glass-card p-6 rounded-2xl border-dashed border-2 border-purple-500/30 hover:border-purple-500/60 transition text-center flex flex-col items-center justify-center relative">
                <input
                  type="file"
                  multiple
                  accept="audio/*"
                  onChange={handleFileUpload}
                  className="absolute inset-0 opacity-0 cursor-pointer w-full h-full"
                />
                <i className="fa-solid fa-cloud-arrow-up text-3xl text-purple-400 mb-2"></i>
                <p className="font-semibold text-base">Arraste seus arquivos MP3 para cá</p>
                <p className="text-xs text-purple-300/50 mt-1">Sua música fica salva localmente no seu navegador</p>
              </div>

              {/* CONTROLES E FORMA DE ONDA / SCRUBBING */}
              <div className="glass-card p-6 rounded-2xl flex flex-col gap-5">
                <div className="flex justify-between items-center">
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="text-xs text-purple-400 uppercase tracking-wider font-semibold">Tocando Agora</span>
                      <span className="text-[10px] bg-purple-900/60 border border-purple-500/30 px-2 py-0.5 rounded-full text-purple-300">
                        {currentPlaylistName}
                      </span>
                    </div>
                    <h2 className="text-lg font-bold text-white mt-1">
                      {tracks[currentIndex] ? tracks[currentIndex].name : 'Nenhuma música selecionada'}
                    </h2>
                  </div>
                  <button
                    onClick={togglePlay}
                    className="w-14 h-14 bg-purple-600 hover:bg-purple-500 rounded-full flex items-center justify-center text-xl shadow-lg shadow-purple-600/50 transition"
                  >
                    <i className={`fa-solid ${isPlaying ? 'fa-pause' : 'fa-play'}`}></i>
                  </button>
                </div>

                {/* BARRA DE TEMPO E WAVEFORM */}
                <div className="flex flex-col gap-2">
                  <div className="flex justify-between text-xs text-purple-300/70">
                    <span>{formatTime(currentTime)}</span>
                    <span className="font-semibold text-purple-300">
                      Ponto de Crossfade: {formatTime(Math.max(0, duration - crossfadeTime))}
                    </span>
                    <span>{formatTime(duration)}</span>
                  </div>

                  <div
                    onClick={handleSeek}
                    className="w-full h-12 bg-black/40 rounded-xl relative overflow-hidden cursor-pointer border border-purple-500/20 group"
                  >
                    <div className="absolute inset-0 flex items-center justify-between px-2 opacity-30">
                      {Array.from({ length: 40 }).map((_, i) => (
                        <div
                          key={i}
                          className="w-1 bg-purple-400 rounded-full"
                          style={{ height: `${20 + Math.sin(i) * 60}%` }}
                        ></div>
                      ))}
                    </div>

                    <div
                      className="h-full bg-gradient-to-r from-purple-700 to-indigo-500 opacity-60 transition-all duration-100"
                      style={{ width: `${duration ? (currentTime / duration) * 100 : 0}%` }}
                    ></div>

                    {duration > 0 && (
                      <div
                        className="absolute right-0 top-0 bottom-0 bg-red-500/20 border-l border-red-500/50 flex items-center justify-center text-[10px] text-red-300 font-bold uppercase tracking-wider"
                        style={{ width: `${(crossfadeTime / duration) * 100}%` }}
                      >
                        Cross
                      </div>
                    )}
                  </div>
                </div>

                {/* PARAMETROS */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2 border-t border-white/5">
                  <div>
                    <label className="text-xs text-purple-300/70 block mb-1">
                      Tempo do Crossfade: <span className="font-bold text-purple-300">{crossfadeTime}s</span>
                    </label>
                    <input
                      type="range"
                      min="1"
                      max="15"
                      value={crossfadeTime}
                      onChange={(e) => setCrossfadeTime(Number(e.target.value))}
                      className="w-full accent-purple-500 cursor-pointer"
                    />
                  </div>

                  <div className="flex items-center justify-between">
                    <div>
                      <span className="text-xs font-semibold text-purple-300 block">Efeito DJ Alan</span>
                      <span className="text-[10px] text-purple-300/50 block">Corta vozes / Eleva batida</span>
                    </div>
                    <button
                      onClick={() => setDjAlanEffect(!djAlanEffect)}
                      className={`w-12 h-6 rounded-full p-1 transition ${
                        djAlanEffect ? 'bg-purple-600' : 'bg-gray-700'
                      }`}
                    >
                      <div
                        className={`w-4 h-4 rounded-full bg-white transition transform ${
                          djAlanEffect ? 'translate-x-6' : 'translate-x-0'
                        }`}
                      ></div>
                    </button>
                  </div>
                </div>

                <button
                  onClick={forceCrossfade}
                  className="w-full py-3 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 rounded-xl font-bold shadow-lg shadow-purple-900/40 flex items-center justify-center gap-2 transition"
                >
                  <i className="fa-solid fa-bolt"></i> Forçar Crossfade Agora
                </button>
              </div>

              {/* FILA ATUAL COM REORDENAÇÃO */}
              <div className="glass-card p-6 rounded-2xl flex flex-col h-[360px]">
                <div className="flex justify-between items-center mb-3">
                  <h3 className="font-bold text-purple-300 flex items-center gap-2">
                    <i className="fa-solid fa-list-ul"></i> Fila da Playlist ({tracks.length})
                  </h3>
                  {tracks.length > 0 && (
                    <button onClick={() => setTracks([])} className="text-xs text-red-400 hover:text-red-300">
                      Limpar
                    </button>
                  )}
                </div>

                <div className="flex-1 overflow-y-auto custom-scrollbar flex flex-col gap-2 pr-1">
                  {tracks.length === 0 ? (
                    <div className="text-center text-purple-300/40 text-sm my-auto">
                      Nenhuma música na fila. Envie seus MP3 acima.
                    </div>
                  ) : (
                    tracks.map((track, idx) => (
                      <div
                        key={track.id}
                        className={`p-3 rounded-xl flex items-center justify-between gap-2 border transition ${
                          idx === currentIndex
                            ? 'bg-purple-600/20 border-purple-500/50 text-purple-200'
                            : 'bg-white/5 border-white/5 hover:bg-white/10'
                        }`}
                      >
                        <div className="flex items-center gap-2 min-w-0">
                          {/* SETAS PARA REORDENAR */}
                          <div className="flex flex-col gap-1 text-purple-300/60">
                            <button
                              onClick={() => moveTrackUp(idx)}
                              disabled={idx === 0}
                              className="hover:text-purple-300 disabled:opacity-20 text-[10px]"
                            >
                              <i className="fa-solid fa-chevron-up"></i>
                            </button>
                            <button
                              onClick={() => moveTrackDown(idx)}
                              disabled={idx === tracks.length - 1}
                              className="hover:text-purple-300 disabled:opacity-20 text-[10px]"
                            >
                              <i className="fa-solid fa-chevron-down"></i>
                            </button>
                          </div>

                          <span className="text-xs font-mono opacity-50 w-4">{idx + 1}</span>
                          <span className="text-sm truncate font-medium">{track.name}</span>
                        </div>

                        <div className="flex items-center gap-2">
                          <button
                            onClick={() => {
                              setCurrentIndex(idx);
                              setIsPlaying(true);
                            }}
                            className="text-purple-400 hover:text-purple-200 p-1"
                          >
                            <i className="fa-solid fa-play text-xs"></i>
                          </button>
                          <button
                            onClick={() => removeTrack(track.id, idx)}
                            className="text-gray-500 hover:text-red-400 p-1"
                          >
                            <i className="fa-solid fa-xmark text-xs"></i>
                          </button>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>

            {/* ASSISTENTE GEMINI DJ */}
            <div className="glass-card p-6 rounded-2xl flex flex-col h-[780px]">
              <div className="flex items-center gap-3 pb-4 border-b border-white/5">
                <div className="w-9 h-9 bg-indigo-600 rounded-lg flex items-center justify-center text-lg">
                  🤖
                </div>
                <div>
                  <h3 className="font-bold text-white text-sm">Assistente Gemini DJ</h3>
                  <p className="text-[10px] text-purple-300/60">Sugestões de Setlist e Momentos</p>
                </div>
              </div>

              <div className="flex-1 overflow-y-auto custom-scrollbar my-4 flex flex-col gap-3 pr-1 text-xs">
                {aiMessages.map((msg, idx) => (
                  <div
                    key={idx}
                    className={`p-3 rounded-xl max-w-[85%] ${
                      msg.sender === 'user'
                        ? 'bg-purple-600 text-white self-end'
                        : 'bg-white/10 text-purple-100 self-start border border-white/5'
                    }`}
                  >
                    {msg.text}
                  </div>
                ))}
              </div>

              <div className="flex gap-2 pt-2 border-t border-white/5">
                <input
                  type="text"
                  placeholder="Pergunte sobre ordem, transição..."
                  value={userInput}
                  onChange={(e) => setUserInput(e.target.value)}
                  onKeyDown={(e) => e.key === 'Enter' && handleSendMessage()}
                  className="flex-1 bg-black/40 border border-purple-500/30 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-purple-500"
                />
                <button
                  onClick={handleSendMessage}
                  className="px-4 py-2 bg-purple-600 hover:bg-purple-500 rounded-xl text-xs font-semibold"
                >
                  <i className="fa-solid fa-paper-plane"></i>
                </button>
              </div>
            </div>
          </div>

          {/* MODAL GERENCIAR PLAYLISTS */}
          {showPlaylistModal && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="glass-card p-6 rounded-2xl max-w-lg w-full border border-purple-500/30 flex flex-col gap-4 max-h-[80vh]">
                <div className="flex justify-between items-center">
                  <h3 className="text-lg font-bold flex items-center gap-2">
                    <i className="fa-solid fa-folder"></i> Minhas Playlists Salvas
                  </h3>
                  <button onClick={() => setShowPlaylistModal(false)} className="text-gray-400 hover:text-white">
                    <i className="fa-solid fa-xmark"></i>
                  </button>
                </div>

                <div className="flex gap-2 my-2">
                  <input
                    type="text"
                    placeholder="Nome da Nova Playlist (ex: Recepção)"
                    value={newPlaylistInput}
                    onChange={(e) => setNewPlaylistInput(e.target.value)}
                    className="flex-1 bg-black/40 border border-purple-500/30 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-purple-500 text-white"
                  />
                  <button
                    onClick={handleCreatePlaylist}
                    className="px-4 py-2 bg-purple-600 hover:bg-purple-500 rounded-xl text-xs font-semibold text-white"
                  >
                    Criar
                  </button>
                </div>

                <div className="overflow-y-auto custom-scrollbar flex flex-col gap-3 pr-1 my-2 max-h-60">
                  {playlists.map((pl) => (
                    <div
                      key={pl.id}
                      className="p-4 rounded-xl bg-white/5 border border-white/5 flex justify-between items-center"
                    >
                      <div>
                        <h4 className="font-bold text-purple-200">{pl.name}</h4>
                        <span className="text-xs text-purple-300/50">Crossfade: {pl.crossfadeTime}s</span>
                      </div>
                      <div className="flex gap-2">
                        <button
                          onClick={() => {
                            setCurrentPlaylistName(pl.name);
                            setCrossfadeTime(pl.crossfadeTime);
                            setDjAlanEffect(pl.djAlanEffect);
                            setShowPlaylistModal(false);
                            showToastMessage('success', `Playlist "${pl.name}" carregada!`);
                          }}
                          className="px-3 py-1.5 bg-purple-600 hover:bg-purple-500 rounded-lg text-xs font-semibold text-white"
                        >
                          Carregar
                        </button>
                        <button
                          onClick={() => {
                            setPlaylists(prev => prev.filter(p => p.id !== pl.id));
                            showToastMessage('success', 'Playlist removida.');
                          }}
                          className="px-2 py-1.5 bg-red-500/20 hover:bg-red-500/40 text-red-400 rounded-lg text-xs"
                        >
                          <i className="fa-solid fa-trash"></i>
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
