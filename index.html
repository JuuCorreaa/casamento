<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DJ Ilú - Player e Compartilhamento de Playlists</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(135deg, #090412 0%, #120926 50%, #05020a 100%);
      color: #f3f4f6;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(168, 85, 247, 0.4);
      border-radius: 4px;
    }
  </style>
</head>
<body class="custom-scrollbar">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- BANCO LOCAL INDEXEDDB ---
    const DB_NAME = 'DJIluDB';
    const STORE_NAME = 'tracks';

    const initDB = () => {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: 'id' });
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    };

    const saveTrackToDB = async (track) => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        store.put(track);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    };

    const getAllTracksFromDB = async () => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    };

    const deleteTrackFromDB = async (id) => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        store.delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    };

    function App() {
      const [shareModeData, setShareModeData] = useState(null); // Se tiver dados na URL, entra no modo compartilhamento
      const [tracks, setTracks] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [currentTime, setCurrentTime] = useState(0);
      const [duration, setDuration] = useState(0);
      const [crossfadeTime, setCrossfadeTime] = useState(6);
      const [djAlanEffect, setDjAlanEffect] = useState(false);
      const [currentPlaylistName, setCurrentPlaylistName] = useState('Entrada do Casamento');
      const [toast, setToast] = useState(null);

      const [playlists, setPlaylists] = useState(() => {
        const saved = localStorage.getItem('dj_ilu_playlists');
        return saved ? JSON.parse(saved) : [
          { id: 'p1', name: 'Entrada do Casamento', crossfadeTime: 6, djAlanEffect: false },
          { id: 'p2', name: 'Festa e Recepção', crossfadeTime: 4, djAlanEffect: true }
        ];
      });

      const [showPlaylistModal, setShowPlaylistModal] = useState(false);
      const audioRef1 = useRef(new Audio());
      const audioRef2 = useRef(new Audio());
      const activeAudioRef = useRef(1);

      const showToastMessage = (type, message) => {
        setToast({ type, message });
        setTimeout(() => setToast(null), 4000);
      };

      // VERIFICAR SE FOI ABERTO VIA LINK COMPARTILHADO (#share)
      useEffect(() => {
        const hash = window.location.hash;
        if (hash.startsWith('#share')) {
          const params = new URLSearchParams(hash.replace('#share?', ''));
          const name = params.get('name') || 'Playlist DJ Ilú';
          const trackListRaw = params.get('tracks');
          const trackNames = trackListRaw ? trackListRaw.split('|') : [];
          const crossfade = Number(params.get('cf')) || 6;

          setShareModeData({
            name,
            trackNames,
            crossfade
          });
        }

        getAllTracksFromDB().then((savedTracks) => {
          if (savedTracks && savedTracks.length > 0) {
            setTracks(savedTracks);
          }
        });
      }, []);

      // Gerar Link de Compartilhamento
      const handleSharePlaylist = () => {
        if (tracks.length === 0) {
          showToastMessage('error', 'Adicione pelo menos uma música para compartilhar a playlist.');
          return;
        }

        const trackNamesStr = encodeURIComponent(tracks.map(t => t.name).join('|'));
        const playlistNameStr = encodeURIComponent(currentPlaylistName);
        const shareUrl = `${window.location.origin}${window.location.pathname}#share?name=${playlistNameStr}&tracks=${trackNamesStr}&cf=${crossfadeTime}`;

        navigator.clipboard.writeText(shareUrl).then(() => {
          showToastMessage('success', 'Link copiado para a área de transferência! Pode enviar no WhatsApp.');
        }).catch(() => {
          showToastMessage('error', 'Não foi possível copiar o link automaticamente.');
        });
      };

      // Tocar / Pausar
      const togglePlay = () => {
        if (tracks.length === 0) {
          showToastMessage('error', 'Nenhuma faixa carregada no player.');
          return;
        }
        const currentAudio = activeAudioRef.current === 1 ? audioRef1.current : audioRef2.current;

        if (isPlaying) {
          currentAudio.pause();
          setIsPlaying(false);
        } else {
          if (!currentAudio.src && tracks[currentIndex]) {
            currentAudio.src = URL.createObjectURL(tracks[currentIndex].file);
          }
          currentAudio.play();
          setIsPlaying(true);
        }
      };

      // -------------------------------------------------------------
      // MODO MINIMALISTA COMPARTILHADO (TIPO SOUNDCLOUD)
      // -------------------------------------------------------------
      if (shareModeData) {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center p-6 bg-gradient-to-b from-black via-zinc-900 to-black text-white">
            {toast && (
              <div className="fixed top-5 right-5 px-5 py-3 rounded-xl bg-emerald-900/90 border border-emerald-500 text-emerald-100 text-sm font-semibold">
                {toast.message}
              </div>
            )}

            <div className="max-w-md w-full glass-card p-8 rounded-3xl border border-white/10 shadow-2xl flex flex-col items-center text-center gap-6">
              {/* ÍCONE / MARCA DJ ILÚ */}
              <div className="w-20 h-20 bg-gradient-to-tr from-purple-600 to-indigo-500 rounded-full flex items-center justify-center text-4xl shadow-xl shadow-purple-500/20 animate-pulse">
                🎧
              </div>

              <div>
                <span className="text-xs font-semibold uppercase tracking-widest text-purple-400">DJ Ilú • Playlist</span>
                <h1 className="text-2xl font-black text-white mt-1">{shareModeData.name}</h1>
                <p className="text-xs text-gray-400 mt-1">{shareModeData.trackNames.length} faixas selecionadas</p>
              </div>

              {/* BOTÃO GRANDE DE EXECUTAR (PLAYLIST SOUNDCLOUD STYLE) */}
              <button
                onClick={() => {
                  window.location.hash = '';
                  setShareModeData(null);
                }}
                className="w-full py-4 bg-white text-black hover:bg-gray-200 rounded-2xl font-extrabold text-base transition transform active:scale-95 flex items-center justify-center gap-3 shadow-lg"
              >
                <i className="fa-solid fa-play text-lg"></i> Abrir e Executar Playlist
              </button>

              {/* LISTA SIMPLES DE MÚSICAS */}
              <div className="w-full text-left bg-black/40 p-4 rounded-2xl border border-white/5 max-h-56 overflow-y-auto custom-scrollbar flex flex-col gap-2">
                <span className="text-[10px] uppercase font-bold text-gray-500 tracking-wider">Sequência das Músicas</span>
                {shareModeData.trackNames.map((name, idx) => (
                  <div key={idx} className="text-xs text-gray-300 py-1.5 border-b border-white/5 flex items-center gap-2 truncate">
                    <span className="text-purple-400 font-mono text-[10px]">{idx + 1}.</span>
                    <span className="truncate">{name}</span>
                  </div>
                ))}
              </div>

              <a
                href={window.location.pathname}
                className="text-xs text-purple-400 hover:text-purple-300 underline mt-2"
              >
                Ir para o DJ Ilú Studio Completo
              </a>
            </div>
          </div>
        );
      }

      // -------------------------------------------------------------
      // MODO DJ ILÚ STUDIO COMPLETO
      // -------------------------------------------------------------
      return (
        <div className="min-h-screen p-4 md:p-8 max-w-7xl mx-auto flex flex-col gap-6 relative">
          {toast && (
            <div className={`fixed top-5 right-5 z-50 px-5 py-3 rounded-xl shadow-2xl text-sm font-semibold flex items-center gap-3 border transition ${
              toast.type === 'error' ? 'bg-red-950/90 border-red-500 text-red-200' : 'bg-emerald-950/90 border-emerald-500 text-emerald-200'
            }`}>
              <i className={`fa-solid ${toast.type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check'}`}></i>
              <span>{toast.message}</span>
            </div>
          )}

          {/* CABEÇALHO */}
          <header className="flex flex-wrap justify-between items-center glass-card p-5 rounded-2xl border border-purple-500/20 gap-4">
            <div className="flex items-center gap-3">
              <div className="w-12 h-12 bg-purple-600 rounded-xl flex items-center justify-center text-2xl shadow-lg shadow-purple-600/40">
                🎧
              </div>
              <div>
                <h1 className="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-indigo-300">
                  DJ Ilú
                </h1>
                <p className="text-xs text-purple-300/60">Mixagem Inteligente e Controle de Transições</p>
              </div>
            </div>

            <div className="flex items-center gap-3">
              {/* BOTÃO COMPARTILHAR LINK */}
              <button
                onClick={handleSharePlaylist}
                className="px-4 py-2 bg-indigo-600/40 hover:bg-indigo-600/60 border border-indigo-500/40 rounded-xl text-sm font-semibold text-indigo-200 flex items-center gap-2 transition"
                title="Copiar link estilo SoundCloud para compartilhar"
              >
                <i className="fa-solid fa-share-nodes"></i> Compartilhar Link
              </button>

              <button
                onClick={() => setShowPlaylistModal(true)}
                className="px-4 py-2 bg-purple-900/40 hover:bg-purple-800/60 border border-purple-500/30 rounded-xl text-sm font-medium flex items-center gap-2 transition"
              >
                <i className="fa-solid fa-folder-open"></i> Playlists <span className="text-xs opacity-50">(Ctrl+J)</span>
              </button>
            </div>
          </header>

          {/* PLAYER PRINCIPAL */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="lg:col-span-2 flex flex-col gap-6">
              {/* DROPZONE MP3 */}
              <div className="glass-card p-6 rounded-2xl border-dashed border-2 border-purple-500/30 hover:border-purple-500/60 text-center flex flex-col items-center justify-center relative">
                <input
                  type="file"
                  multiple
                  accept="audio/*"
                  onChange={async (e) => {
                    const files = Array.from(e.target.files);
                    for (let file of files) {
                      const trackData = {
                        id: 'track_' + Date.now() + '_' + Math.random().toString(36).substring(2, 5),
                        name: file.name.replace(/\.[^/.]+$/, ''),
                        file: file,
                      };
                      await saveTrackToDB(trackData);
                      setTracks((prev) => [...prev, trackData]);
                    }
                    showToastMessage('success', `${files.length} música(s) adicionada(s)!`);
                  }}
                  className="absolute inset-0 opacity-0 cursor-pointer w-full h-full"
                />
                <i className="fa-solid fa-cloud-arrow-up text-3xl text-purple-400 mb-2"></i>
                <p className="font-semibold text-base">Arraste seus arquivos MP3 para cá</p>
                <p className="text-xs text-purple-300/50 mt-1">Sua música fica salva localmente no seu navegador</p>
              </div>

              {/* CONTROLES */}
              <div className="glass-card p-6 rounded-2xl flex flex-col gap-5">
                <div className="flex justify-between items-center">
                  <div>
                    <span className="text-xs text-purple-400 uppercase font-semibold block">{currentPlaylistName}</span>
                    <h2 className="text-lg font-bold text-white mt-1">
                      {tracks[currentIndex] ? tracks[currentIndex].name : 'Nenhuma música selecionada'}
                    </h2>
                  </div>
                  <button
                    onClick={togglePlay}
                    className="w-14 h-14 bg-purple-600 hover:bg-purple-500 rounded-full flex items-center justify-center text-xl shadow-lg transition"
                  >
                    <i className={`fa-solid ${isPlaying ? 'fa-pause' : 'fa-play'}`}></i>
                  </button>
                </div>
              </div>
            </div>

            {/* PAINEL LATERAL DE INFORMAÇÕES */}
            <div className="glass-card p-6 rounded-2xl flex flex-col h-full justify-between">
              <div>
                <h3 className="font-bold text-white text-base mb-2">Compartilhamento Rápido</h3>
                <p className="text-xs text-purple-300/70 leading-relaxed">
                  Crie links limpos no estilo SoundCloud com o degradê preto e cinza para enviar para noivos, noivas ou organizadores do evento!
                </p>
              </div>
              <button
                onClick={handleSharePlaylist}
                className="w-full py-3 bg-purple-600 hover:bg-purple-500 rounded-xl font-bold text-sm shadow-lg transition mt-4"
              >
                <i className="fa-solid fa-link mr-2"></i> Copiar Link Único
              </button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
